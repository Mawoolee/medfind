[program:medfind-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/medfind/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/medfind/storage/logs/queue.log
stopwaitsecs=3600

[program:medfind-reverb]
process_name=%(program_name)s
command=php /var/www/medfind/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/medfind/storage/logs/reverb.log
stopwaitsecs=10
